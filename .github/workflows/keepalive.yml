name: Keepalive Workflow

on:
  schedule:
    # Run once every 30 days to keep GitHub Actions from pausing on inactive repos
    - cron: "0 0 1 * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: gautamkrishnar/keepalive-workflow@v1
